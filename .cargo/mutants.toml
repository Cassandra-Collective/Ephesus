# The mutation-round spec (GYM-008's rules in Rust; RUST-PLAN R0.2).
#
# cargo-mutants reads this file on every run. `cargo xtask mutants <package>`
# runs the round with it and then the control (one shard, no test run, every
# viable mutant must be missed); see xtask/src/mutants.rs for the five rules a
# round is judged by.
#
# An exclusion is a decision: it names the mutant and why no test can or should
# kill it, in a reviewed commit. A survivor no test COULD kill is a design smell
# (memory: an equivalent mutant is a design smell): delete the duplicate before
# reaching for an exclusion.
exclude_re = [
  # eph-schema's strict JSON reader turns `null` into `Value::Null`, and
  # `Value::default()` IS `Value::Null`, so this mutant is the same program.
  # There is no duplicate to delete: serde calls `visit_unit` for `null`, and the
  # trait's default refuses it (R1.1 round 1, 2026-10-20).
  'StrictVisitor>::visit_unit -> Result<Value, E> with Ok\(Default::default\(\)\)',
  # xtask's gate runner returns the coverage step's exit code. A test through the
  # real runner, with the xtask binary standing in for cargo, kills the None,
  # Some(0) and Some(-1) mutants. Telling Some(1) apart needs a step that returns
  # 0, which is a real instrumented run of a whole workspace. `cargo xtask gate`
  # performs one on every invocation; a test doing it would nest one coverage run
  # inside another, once per mutant (R1.1 xtask round 2, 2026-10-20).
  'CargoRunner>::coverage -> Option<i32> with Some\(1\)',
  # eph-fs syncs a renamed file's directory on POSIX so the rename survives a
  # power cut. Its only effect is durability across a power cut, which no test
  # can observe: a process that reads the directory back sees the rename either
  # way. On Windows the body does not run at all (R1.2 round 1, 2026-10-20).
  'sync_dir -> io::Result<\(\)> with Ok\(\(\)\)',
  # eph-git waits for a git's output until its deadline plus half a second, so a
  # grandchild that holds the pipes a moment past git's exit does not fail the
  # call. Subtracting the grace instead changes only when, inside that half
  # second, the wait gives up. A test that could see it would have to time a
  # pipe's close to within the grace on a loaded machine, which flakes; the
  # cases either side of the window (output that arrives, output that never
  # does) are tested (R1.3 eph-git round 2, 2026-10-20).
  'replace \+ with - in drain_until',
  # eph-agora's book reader skips a sealed segment the cursor has passed without
  # opening it, as the TypeScript build's reader did ("segment skipping, with no
  # I/O"). At the one boundary, a cursor exactly at a segment's end, `>=` opens
  # that segment and reads nothing from it: the same answer and one open more.
  # A test could see it only by making the file unopenable, which eph-agora may
  # not do (`OpenOptions::open` is refused outside eph-fs), and the open changes
  # no answer (R1.4b round 1, 2026-10-25; the Architect chose the exclusion).
  'replace > with >= in Book::since',
]

# Build without debug info ([profile.mutants] in Cargo.toml): a round relinks
# every test binary once per mutant.
profile = "mutants"
