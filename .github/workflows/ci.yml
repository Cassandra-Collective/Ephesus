name: CI

on:
  push:
    # feature/fix branches run CI too (Architect verdict, M3 close): the /goal
    # loop's per-package "CI green" is a real run, not a local re-enactment.
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

jobs:
  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only step needs the merge base with the PR's target;
          # a depth-1 clone has no ancestry to find it in (GYM-005).
          fetch-depth: 0
      - name: Check relative markdown links resolve
        run: |
          set -e
          fail=0
          while IFS=: read -r file link; do
            target="${link%%#*}"
            [ -z "$target" ] && continue
            resolved="$(dirname "$file")/$target"
            if [ ! -e "$resolved" ]; then
              echo "BROKEN: $file -> $link"
              fail=1
            fi
          done < <(grep -RhoE --include='*.md' -e '\]\((\./|\.\./)[^)]+\)' . \
                   | sed 's/.*](\(.*\))/\1/' > /tmp/links.txt; \
                   grep -RnoE --include='*.md' -e '\]\((\./|\.\./)[^)]+\)' . \
                   | sed 's/\(^[^:]*\):[0-9]*:.*](\(.*\))/\1:\2/')
          exit $fail
      - name: ADRs are append-only (accepted ADRs unchanged on PRs)
        if: github.event_name == 'pull_request'
        run: |
          set -e
          # Append-only means existing ADRs are never modified, deleted, or
          # renamed — ADDING a new ADR is the one legal change and must pass
          # (--diff-filter=a excludes additions). Diff against the merge base,
          # not the base tip, so drift on the base branch is never blamed on
          # the PR; and no error is swallowed — a git failure here must fail
          # the check, not silently pass it (GYM-005: both defects were real,
          # found by the first PR that ever added an ADR).
          git fetch origin "${{ github.base_ref }}"
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          changed="$(git diff --name-only --diff-filter=a "$base" HEAD -- 'docs/adr/ADR-*.md')"
          if [ -n "$changed" ]; then
            echo "Accepted ADRs modified or removed (ADRs are append-only; supersede instead):"
            echo "$changed"
            exit 1
          fi
          echo "append-only holds: only additions under docs/adr/ (or no ADR changes)"
      - name: The README's landed list keeps up with the register
        # M8.4 fixed a README that was "two milestones stale" and by M8.9 the
        # same section was three packages behind, because nothing was watching.
        # This compares the README's own `<!-- landed: -->` marker against the
        # packages ticked in docs/PROGRESS.md; it does not read the prose.
        run: node scripts/check-readme-current.cjs

  code:
    name: Typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect scaffold
        id: scaffold
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; \
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (pre-M0.1) — skipping code checks."; fi
      - uses: actions/setup-node@v4
        if: steps.scaffold.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.scaffold.outputs.present == 'true'
        run: npm ci
      # GYM-012: a spec whose anchor no longer matches its code fails here,
      # naming the mutant and the file, instead of rotting until someone runs
      # the round (TEST-STRATEGY §10). `--check` runs no test and writes
      # nothing, and it needs a clean tree: straight after Install, only the
      # ignored node_modules has been written.
      - name: Mutation specs still match their code (GYM-012)
        if: steps.scaffold.outputs.present == 'true'
        run: |
          shopt -s nullglob
          specs=(test/mutation/*.json)
          if [ ${#specs[@]} -eq 0 ]; then echo "no spec under test/mutation/: GYM-012 checks nothing"; exit 1; fi
          for spec in "${specs[@]}"; do node scripts/mutate.cjs "$spec" --check || exit 1; done
      - name: Typecheck
        if: steps.scaffold.outputs.present == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.scaffold.outputs.present == 'true'
        run: npm run lint
      - name: Invariant tripwires (single committer, append-only, reachability)
        if: steps.scaffold.outputs.present == 'true'
        run: node scripts/check-invariants.cjs
      # One run, under coverage: v8 instruments nothing, so the suite executes
      # the same code it would without it, and the floor check reads the result
      # (M8.0, the seam rule — ENGINEERING-STANDARDS §6.7).
      - name: Test (under coverage)
        if: steps.scaffold.outputs.present == 'true'
        run: npm run test:coverage
      - name: Coverage floors and untested modules (the seam rule)
        if: steps.scaffold.outputs.present == 'true'
        run: node scripts/check-coverage.cjs --emit coverage/measured-linux.json
      # Kept on every run, pass or fail: linux floors are recorded from THIS
      # condition, never from a developer's machine — the first record with
      #   node scripts/check-coverage.cjs --seed --from <artifact> --platform linux
      # and every ratchet after it with --update --from. Take the artifact from
      # a PUSH run: a pull_request run measures a synthetic merge commit, and
      # the recorded condition would name a commit that exists on no branch.
      # A run that never reached the emit (the suite failed, or the record
      # could not be read) has nothing to keep, and the step says so.
      - name: Keep the linux measurement
        if: always() && steps.scaffold.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-measured-linux
          path: coverage/measured-linux.json
          if-no-files-found: warn

  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No commit is authored, committed or co-authored as Claude
        run: node scripts/check-attribution.cjs
